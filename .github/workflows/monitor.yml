name: HTML Monitor

on:
  schedule:
    - cron: "*/10 * * * *"   # 10分ごと(UTC基準。GitHub側の混雑で数分〜十数分遅れることがあります)
  workflow_dispatch:          # Actions画面から手動実行も可能

permissions:
  contents: write             # スナップショットをコミットするため

concurrency:
  group: html-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check pages
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NOTIFY_ERRORS: "false"   # 取得エラーもDiscordに通知したい場合は "true"
        run: python monitor.py

      - name: Commit snapshots
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "snapshot: $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
